plugins {
    id 'idea'
    id 'net.neoforged.moddev'
}

idea {
    module {
        excludeDirs += file('./run/')
    }
}

neoForge {
    version = libs.neoForge.get().version

    runs {
        client {
            client()
            ideName = 'NeoForge Client'
        }
        configureEach {
            jvmArguments = [
                '-ea',
                "-Dlog4j.configurationFile=${rootProject.file('log4j.yaml').absolutePath}"
            ]
        }
    }
}

tasks.named('downloadAssets', net.neoforged.nfrtgradle.DownloadAssets) {
    javaExecutable = javaToolchains.launcherFor(java.toolchain).map { it.executablePath.asFile.absolutePath }
}

dependencies {
    runtimeOnly project(':')
    runtimeOnly libs.jacksonDataformatYaml
    runtimeOnly libs.jacksonDatabind
}
